<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsored Streets — Neighborhood Value Plus</title>
<style>
  :root {
    --color-bg: #F7F5F1;
    --color-ink: #1F2A24;
    --color-ink-soft: #566056;
    --color-line: #DCD6C9;
    --color-accent: #2F6B4F;
    --color-accent-soft: #E7EFE9;
    --color-warn: #B4652A;
    --radius: 10px;
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--color-line);
    background: var(--color-bg);
  }

  header h1 {
    font-family: 'Georgia', serif;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--color-ink-soft);
    font-size: 15px;
    max-width: 640px;
    line-height: 1.5;
  }

  #layout {
    display: flex;
    height: calc(100vh - 108px);
  }

  #map {
    flex: 1;
    height: 100%;
  }

  #sidebar {
    width: 340px;
    border-left: 1px solid var(--color-line);
    background: #FFFFFF;
    overflow-y: auto;
    padding: 20px;
  }

  #sidebar h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-ink-soft);
    margin: 0 0 12px;
  }

  .empty-state {
    color: var(--color-ink-soft);
    font-size: 14px;
    line-height: 1.6;
    padding: 16px;
    background: var(--color-accent-soft);
    border-radius: var(--radius);
  }

  .sponsor-card {
    border: 1px solid var(--color-line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .sponsor-card img.sponsor-photo {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 10px;
    background: var(--color-accent-soft);
  }

  .sponsor-card h3 {
    font-size: 16px;
    margin: 0 0 4px;
  }

  .sponsor-card .street {
    font-size: 13px;
    color: var(--color-ink-soft);
    margin: 0 0 10px;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--color-accent-soft);
    color: var(--color-accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .completion-item {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--color-line);
  }

  .completion-item h4 {
    font-size: 13px;
    margin: 0 0 8px;
    color: var(--color-ink);
  }

  .photo-row {
    display: flex;
    gap: 8px;
  }

  .photo-row figure {
    margin: 0;
    flex: 1;
    min-width: 0;
  }

  .photo-row img {
    width: 100%;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--color-accent-soft);
    display: block;
  }

  .photo-row figcaption {
    font-size: 10px;
    color: var(--color-ink-soft);
    text-align: center;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .completed-by {
    font-size: 12px;
    color: var(--color-ink-soft);
    margin-top: 8px;
  }

  .team-photo-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .team-photo-wrap img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--color-accent-soft);
  }

  #error-banner {
    display: none;
    background: #FBEAE0;
    color: var(--color-warn);
    padding: 12px 20px;
    font-size: 13px;
    border-bottom: 1px solid var(--color-line);
  }

  .info-window-content {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    max-width: 220px;
  }

  .info-window-content h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }

  .info-window-content img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Sponsored Streets</h1>
  <p>The city maintains the roads. These local businesses and neighbors are helping maintain everything else — see who's stepped up on your street, and what's been done.</p>
</header>

<div id="error-banner"></div>

<div id="layout">
  <div id="map"></div>
  <div id="sidebar">
    <h2>Active Sponsorships</h2>
    <div id="sponsor-list">
      <div class="empty-state">Loading sponsored streets…</div>
    </div>
  </div>
</div>

<script>
  // ---- Configuration ----
  const SUPABASE_URL = 'https://uunaaabykbhavngqfitw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1bmFhYWJ5a2JoYXZuZ3FmaXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1NDM4MzUsImV4cCI6MjA2OTExOTgzNX0.S-zLL1TXOl2z5t0AnKJkacB-gwsh_hn3AKh0LG-HXPA'; // anon key — safe to expose publicly; RLS/view scoping controls what it can actually read. Being rotated per standing practice since it appeared in chat.

  const PORTLAND_CENTER = { lat: 45.5152, lng: -122.6784 };

  let map;
  let infoWindow;

  function showError(message) {
    const banner = document.getElementById('error-banner');
    banner.textContent = message;
    banner.style.display = 'block';
  }

  async function supabaseGet(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if (!res.ok) {
      throw new Error(`Supabase request failed (${res.status}): ${path}`);
    }
    return res.json();
  }

  function normalizedNameToGeoJson(geomHex) {
    // street_centerlines.geom is stored as PostGIS geography — we fetch
    // it pre-converted via a Supabase view/RPC that returns GeoJSON text.
    // This function assumes geom arrives as a GeoJSON object already
    // (see fetchCenterlines below, which requests it via ST_AsGeoJSON).
    return geomHex;
  }

  async function fetchCenterlines(segmentIds) {
    if (segmentIds.length === 0) return [];
    const idList = segmentIds.join(',');
    // Uses a Postgres RPC (see accompanying SQL) that returns id + GeoJSON text,
    // since raw PostGIS geography columns aren't directly JSON-serializable
    // via PostgREST without a cast.
    return supabaseGet(`rpc/get_centerlines_geojson?ids=${encodeURIComponent(idList)}`);
  }

  async function fetchSponsorships() {
    return supabaseGet('map_sponsorships_public?select=*');
  }

  async function fetchCompletions(segmentIds) {
    if (segmentIds.length === 0) return [];
    const idList = segmentIds.map(id => `matched_segment_id.eq.${id}`).join(',');
    return supabaseGet(`service_completions?or=(${idList})&select=*&order=completed_at.desc`);
  }

  function renderSidebar(sponsorships, completionsBySegment) {
    const list = document.getElementById('sponsor-list');
    if (sponsorships.length === 0) {
      list.innerHTML = '<div class="empty-state">No active sponsorships yet. Interested in sponsoring a street near you? Reach out to get started.</div>';
      return;
    }

    list.innerHTML = '';
    sponsorships.forEach(sponsor => {
      const card = document.createElement('div');
      card.className = 'sponsor-card';

      const photoHtml = sponsor.photo_url
        ? `<img class="sponsor-photo" src="${sponsor.photo_url}" alt="${sponsor.sponsor_display_name}">`
        : '';

      const completions = completionsBySegment[sponsor.matched_segment_id] || [];
      const completionsHtml = completions.map(c => {
        const before = c.before_photo_url ? `<figure><img src="${c.before_photo_url}" alt="Before"><figcaption>Before</figcaption></figure>` : '';
        const after = c.after_photo_url ? `<figure><img src="${c.after_photo_url}" alt="After"><figcaption>After</figcaption></figure>` : '';
        const team = c.team_photo_url
          ? `<div class="team-photo-wrap"><img src="${c.team_photo_url}" alt="${c.completed_by || 'Team'}"><span class="completed-by">${c.completed_by || ''}</span></div>`
          : (c.completed_by ? `<div class="completed-by">Completed by ${c.completed_by}</div>` : '');
        const date = c.completed_at ? new Date(c.completed_at).toLocaleDateString() : '';
        return `
          <div class="completion-item">
            <h4>${c.service_type || 'Service'} ${date ? '&middot; ' + date : ''}</h4>
            <div class="photo-row">${before}${after}</div>
            ${team}
          </div>
        `;
      }).join('');

      card.innerHTML = `
        ${photoHtml}
        <span class="badge">${sponsor.match_status === 'matched' ? 'Verified location' : 'Location pending review'}</span>
        <h3>${sponsor.sponsor_display_name}</h3>
        <p class="street">${sponsor.street_name}</p>
        ${completionsHtml}
      `;
      list.appendChild(card);
    });
  }

  function drawSegment(map, geojsonGeometry, sponsor) {
    const feature = map.data.addGeoJson({
      type: 'Feature',
      geometry: geojsonGeometry,
      properties: { sponsor_id: sponsor.id }
    })[0];

    return feature;
  }

  async function init() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: PORTLAND_CENTER,
      zoom: 12,
      mapId: 'DEMO_MAP_ID'
    });

    infoWindow = new google.maps.InfoWindow();

    let sponsorships = [];
    try {
      sponsorships = await fetchSponsorships();
    } catch (err) {
      showError('Could not load sponsorship data. Please try again shortly.');
      console.error(err);
      return;
    }

    const matchedSponsors = sponsorships.filter(s => s.matched_segment_id);
    const unmatchedSponsors = sponsorships.filter(s => !s.matched_segment_id);
    const segmentIds = matchedSponsors.map(s => s.matched_segment_id);

    let centerlines = [];
    let completions = [];
    try {
      [centerlines, completions] = await Promise.all([
        fetchCenterlines(segmentIds),
        fetchCompletions(segmentIds)
      ]);
    } catch (err) {
      showError('Some map details could not be loaded, showing what is available.');
      console.error(err);
    }

    const centerlineById = {};
    centerlines.forEach(c => { centerlineById[c.id] = c; });

    const completionsBySegment = {};
    completions.forEach(c => {
      if (!completionsBySegment[c.matched_segment_id]) completionsBySegment[c.matched_segment_id] = [];
      completionsBySegment[c.matched_segment_id].push(c);
    });

    map.data.setStyle({
      strokeColor: '#2F6B4F',
      strokeWeight: 4
    });

    matchedSponsors.forEach(sponsor => {
      const centerline = centerlineById[sponsor.matched_segment_id];
      if (!centerline || !centerline.geojson) return;
      try {
        const geometry = JSON.parse(centerline.geojson);
        drawSegment(map, geometry, sponsor);
      } catch (err) {
        console.error('Could not parse geometry for segment', sponsor.matched_segment_id, err);
      }
    });

    map.data.addListener('click', (event) => {
      const sponsorId = event.feature.getProperty('sponsor_id');
      const sponsor = sponsorships.find(s => s.id === sponsorId);
      if (!sponsor) return;

      const photoHtml = sponsor.photo_url ? `<img src="${sponsor.photo_url}" alt="${sponsor.sponsor_display_name}">` : '';
      infoWindow.setContent(`
        <div class="info-window-content">
          ${photoHtml}
          <h3>${sponsor.sponsor_display_name}</h3>
          <p>${sponsor.street_name}</p>
        </div>
      `);
      infoWindow.setPosition(event.latLng);
      infoWindow.open(map);
    });

    // Unmatched sponsors: generic marker, not a highlighted street segment
    unmatchedSponsors.forEach(sponsor => {
      if (sponsor.latitude == null || sponsor.longitude == null) return;
      const marker = new google.maps.Marker({
        position: { lat: sponsor.latitude, lng: sponsor.longitude },
        map,
        title: sponsor.sponsor_display_name,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 8,
          fillColor: '#B4652A',
          fillOpacity: 1,
          strokeWeight: 1,
          strokeColor: '#ffffff'
        }
      });
      marker.addListener('click', () => {
        infoWindow.setContent(`
          <div class="info-window-content">
            <h3>${sponsor.sponsor_display_name}</h3>
            <p>${sponsor.street_name} <br><em>Location pending verification</em></p>
          </div>
        `);
        infoWindow.setPosition(marker.getPosition());
        infoWindow.open(map);
      });
    });

    renderSidebar(sponsorships, completionsBySegment);
  }

  window.initMap = init;
</script>

<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDvhU7V4buTn7Sc0fRlr_V5FA2nftN7HK8&callback=initMap&loading=async">
</script>

</body>
</html>

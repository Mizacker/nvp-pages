<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsored Streets — Neighborhood Value Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1F17;
    --surface: #14281F;
    --surface-raised: #1A3328;
    --line: #24402F;
    --ink: #F4F7F2;
    --ink-soft: #8FA89A;
    --mint: #3DDC97;
    --mint-glow: rgba(61, 220, 151, 0.35);
    --coral: #FF6B4A;
    --coral-glow: rgba(255, 107, 74, 0.35);
    --radius: 16px;

    --panel-bg: #16161A;
    --panel-surface: #202024;
    --panel-surface-raised: #2A2A30;
    --panel-line: #38383E;
    --panel-ink-soft: #A8A8B0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 700px 500px at 15% 0%, rgba(61,220,151,0.14), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 30%, rgba(255,107,74,0.10), transparent 60%);
    pointer-events: none;
  }

  header {
    position: relative;
    z-index: 2;
    padding: 22px 32px 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 31, 23, 0.85);
    backdrop-filter: blur(12px);
  }

  .header-left h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .header-left p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-soft);
    max-width: 480px;
    line-height: 1.5;
  }

  .sponsor-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }

  .sponsor-logo-chip {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    object-fit: contain;
    background: #fff;
    border: 1px solid var(--panel-line);
    flex-shrink: 0;
    padding: 3px;
  }

  .header-logo {
    height: 40px;
    width: auto;
    display: block;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-stats { display: flex; gap: 22px; flex-shrink: 0; }
  .stat { text-align: right; }

  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--mint);
    line-height: 1;
  }

  .stat .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-top: 3px;
  }

  #error-banner {
    display: none;
    position: relative;
    z-index: 2;
    background: rgba(255, 107, 74, 0.15);
    color: var(--coral);
    padding: 10px 32px;
    font-size: 12px;
    border-bottom: 1px solid var(--line);
  }

  #layout { position: relative; z-index: 1; height: calc(100vh - 96px); }

  #map {
    position: absolute;
    inset: 0;
    filter: saturate(0.85) brightness(0.92);
  }

  #sidebar {
    position: absolute;
    top: 20px;
    right: 20px;
    bottom: 20px;
    width: 320px;
    background: rgba(22, 22, 26, 0.90);
    backdrop-filter: blur(16px);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    overflow-y: auto;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  #sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--panel-ink-soft);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #sidebar h2::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 8px var(--mint-glow);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .empty-state {
    color: var(--panel-ink-soft);
    font-size: 13px;
    line-height: 1.6;
    padding: 18px;
    background: var(--panel-surface);
    border-radius: 12px;
    border: 1px dashed var(--panel-line);
  }

  .sponsor-card {
    background: var(--panel-surface);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .sponsor-card:hover { border-color: var(--mint); }

  .sponsor-card h3 { font-size: 15px; margin: 0 0 3px; font-weight: 700; }

  .sponsor-card .street {
    font-size: 12px;
    color: var(--panel-ink-soft);
    margin: 0 0 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  .sponsor-links {
    display: flex;
    gap: 8px;
    margin: 0 0 10px;
    flex-wrap: wrap;
  }

  .sponsor-links a {
    font-size: 11px;
    font-weight: 600;
    color: var(--mint);
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid rgba(61,220,151,0.3);
    border-radius: 20px;
    background: rgba(61,220,151,0.08);
    transition: background 0.15s ease;
  }

  .sponsor-links a:hover { background: rgba(61,220,151,0.18); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .badge.matched { background: rgba(61, 220, 151, 0.15); color: var(--mint); }
  .badge.pending { background: rgba(255, 107, 74, 0.15); color: var(--coral); }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .completion-item {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--panel-line);
  }

  .completion-item h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
    color: var(--panel-ink-soft);
  }

  .photo-row { display: flex; gap: 6px; }
  .photo-row figure { margin: 0; flex: 1; min-width: 0; }

  .photo-row a { display: block; cursor: pointer; }

  .photo-row img {
    width: 100%;
    height: 72px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--panel-surface-raised);
    display: block;
    transition: opacity 0.15s ease;
  }

  .photo-row a:hover img { opacity: 0.82; }

  .photo-row figcaption {
    font-size: 9px;
    color: var(--panel-ink-soft);
    text-align: center;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .completed-by { font-size: 11px; color: var(--panel-ink-soft); margin-top: 6px; }

  .team-photo-wrap { display: flex; align-items: center; gap: 7px; margin-top: 6px; }

  .team-photo-wrap img {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--panel-surface-raised);
  }

  #sponsor-popup {
    display: none;
    position: absolute;
    z-index: 50;
    width: 260px;
    background: var(--panel-surface);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    padding: 16px;
    font-family: 'Archivo', sans-serif;
    transform: translate(-50%, calc(-100% - 18px));
  }

  #sponsor-popup.open { display: block; }

  #sponsor-popup::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    background: var(--panel-surface);
    border-right: 1px solid var(--panel-line);
    border-bottom: 1px solid var(--panel-line);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }

  #sponsor-popup .popup-close {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 20px;
    line-height: 1;
    color: var(--panel-ink-soft);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  #sponsor-popup .popup-close:hover { color: var(--ink); }

  #sponsor-popup .popup-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-right: 20px;
  }

  #sponsor-popup .popup-logo {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    object-fit: cover;
    border: 1px solid var(--panel-line);
    flex-shrink: 0;
  }

  #sponsor-popup h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }

  #sponsor-popup .popup-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 0;
    margin-top: 2px;
  }

  #sponsor-popup .popup-badge::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  #sponsor-popup .popup-detail-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    padding: 7px 0;
    border-top: 1px solid var(--panel-line);
  }

  #sponsor-popup .popup-detail-row .label {
    color: var(--panel-ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10px;
  }

  #sponsor-popup .popup-detail-row .value {
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
  }

  #sponsor-popup .popup-links {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  #sponsor-popup .popup-links a {
    font-size: 12px;
    font-weight: 600;
    color: #14281F;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 20px;
    background: var(--mint);
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  #sponsor-popup .popup-links a:hover { background: #57E8AB; }

  #photo-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(11, 31, 23, 0.92);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  #photo-lightbox.open { display: flex; }

  #photo-lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  #photo-lightbox .lightbox-caption {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }

  #photo-lightbox .lightbox-close {
    position: absolute;
    top: 20px;
    right: 28px;
    font-size: 28px;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
  }

  .gm-style .gm-style-iw-c { display: none; }

  /* Layer toggle control — lets users show/hide Sponsors and Coverage
     Zones independently, per the standard "Layer List" map UI pattern.
     This matters once many sponsors and zones coexist and start to
     visually compete for attention on the same map. */
  #layer-toggle {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(22, 22, 26, 0.90);
    backdrop-filter: blur(16px);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    font-family: 'Archivo', sans-serif;
  }

  #layer-toggle .toggle-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--panel-ink-soft);
    margin-bottom: 8px;
  }

  #layer-toggle label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    padding: 4px 0;
    user-select: none;
  }

  #layer-toggle input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--mint);
    cursor: pointer;
  }

  #layer-toggle .swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  @media (max-width: 1024px) {
    #layer-toggle {
      top: 12px;
      left: 12px;
      padding: 10px 12px;
    }
  }

  #sheet-handle {
    display: none;
  }

  @media (max-width: 1024px) {
    #sidebar {
      top: auto;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 96px;
      max-height: 96px;
      border-radius: 20px 20px 0 0;
      transition: height 0.28s cubic-bezier(0.32, 0.72, 0, 1),
                  max-height 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      padding-top: 8px;
      overflow: hidden;
    }

    #sidebar:not(.expanded) #sponsor-list {
      display: none;
    }

    #sidebar.expanded {
      height: auto;
      max-height: 78vh;
      overflow-y: auto;
    }

    #sheet-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0 10px;
      cursor: pointer;
      touch-action: none;
    }

    #sheet-handle .bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--panel-line);
    }

    #sheet-handle .peek-label {
      font-size: 12px;
      color: var(--panel-ink-soft);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #sidebar h2 { display: none; }
    #sidebar.expanded h2 { display: flex; }

    .header-stats { display: none; }
    header { padding: 16px 20px 14px; }
    .header-left h1 { font-size: 18px; }
    .header-left p { font-size: 12px; }
  }

  @media (max-width: 760px) {
    #sidebar { max-height: 70vh; }
    .sponsor-card { padding: 11px; margin-bottom: 8px; }
    .sponsor-card h3 { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-brand">
      <img src="Studio-Project.png" alt="Neighborhood Value Plus" class="header-logo">
      <h1>Sponsored Streets</h1>
    </div>
    <p>The city maintains the roads. See who's stepped up on yours — live.</p>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="num" id="stat-sponsors">—</div>
      <div class="label">Active</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-streets">43,042</div>
      <div class="label">Streets tracked</div>
    </div>
  </div>
</header>

<div id="error-banner"></div>

<div id="layout">
  <div id="map"></div>
  <div id="layer-toggle">
    <div class="toggle-title">Show on map</div>
    <label>
      <input type="checkbox" id="toggle-sponsors" checked>
      <span class="swatch" style="background:#FF6B4A;"></span>
      Sponsors
    </label>
    <label>
      <input type="checkbox" id="toggle-zones" checked>
      <span class="swatch" style="background:#3DDC97;"></span>
      Coverage Zones
    </label>
  </div>
  <div id="sidebar">
    <div id="sheet-handle">
      <div class="bar"></div>
      <div class="peek-label">
        <span id="peek-count">—</span> live sponsorships · tap to view
      </div>
    </div>
    <h2>Live Sponsorships</h2>
    <div id="sponsor-list">
      <div class="empty-state">Loading sponsored streets…</div>
    </div>
  </div>
</div>

<div id="photo-lightbox">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
  const SUPABASE_URL = 'https://uunaaabykbhavngqfitw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1bmFhYWJ5a2JoYXZuZ3FmaXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1NDM4MzUsImV4cCI6MjA2OTExOTgzNX0.S-zLL1TXOl2z5t0AnKJkacB-gwsh_hn3AKh0LG-HXPA';
  const PORTLAND_CENTER = { lat: 45.5152, lng: -122.6784 };
  const MAP_ID = '35e98e58e37c21e68f92fe43';

  let map;
  const sponsorPositions = {};
  const sponsorMarkers = []; // collected so they can be passed to MarkerClusterer
  let sponsorClusterer = null;
  let zoneClusterer = null;

  function showError(message) {
    const banner = document.getElementById('error-banner');
    banner.textContent = message;
    banner.style.display = 'block';
  }

  function openLightbox(src, caption) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-caption').textContent = caption || '';
    document.getElementById('photo-lightbox').classList.add('open');
  }

  document.getElementById('photo-lightbox').addEventListener('click', () => {
    document.getElementById('photo-lightbox').classList.remove('open');
  });

  async function supabaseGet(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if (!res.ok) throw new Error(`Supabase request failed (${res.status}): ${path}`);
    return res.json();
  }

  async function fetchCenterlines(segmentIds) {
    if (segmentIds.length === 0) return [];
    const idList = segmentIds.join(',');
    return supabaseGet(`rpc/get_centerlines_geojson?ids=${encodeURIComponent(idList)}`);
  }

  async function fetchSponsorships() {
    return supabaseGet('map_sponsorships_public?select=*');
  }

  async function fetchCompletions(segmentIds) {
    if (segmentIds.length === 0) return [];
    const idList = segmentIds.map(id => `matched_segment_id.eq.${id}`).join(',');
    return supabaseGet(`service_completions?or=(${idList})&select=*&order=completed_at.desc`);
  }

  function safeUrl(url) {
    if (!url) return null;
    try {
      const u = new URL(url.startsWith('http') ? url : `https://${url}`);
      return u.href;
    } catch {
      return null;
    }
  }

  function renderSponsorLinks(sponsor, containerClass) {
    const links = [];
    const website = safeUrl(sponsor.website_url);
    if (website) {
      links.push(`<a href="${website}" target="_blank" rel="noopener">Website</a>`);
    }
    if (sponsor.instagram_url) {
      const ig = safeUrl(sponsor.instagram_url);
      if (ig) links.push(`<a href="${ig}" target="_blank" rel="noopener">Instagram</a>`);
    }
    if (links.length === 0) return '';
    return `<div class="${containerClass}">${links.join('')}</div>`;
  }

  function renderSidebar(sponsorships, completionsBySegment) {
    document.getElementById('stat-sponsors').textContent = sponsorships.length;
    const peekCount = document.getElementById('peek-count');
    if (peekCount) peekCount.textContent = sponsorships.length;

    const list = document.getElementById('sponsor-list');
    if (sponsorships.length === 0) {
      list.innerHTML = '<div class="empty-state">No active sponsorships yet. Be the first to claim your street.</div>';
      return;
    }

    list.innerHTML = '';
    sponsorships.forEach(sponsor => {
      const card = document.createElement('div');
      card.className = 'sponsor-card';

      const isMatched = sponsor.match_status === 'matched';
      const sponsorColor = colorForSponsor(sponsor.id);
      const badgeHtml = isMatched
        ? `<span class="badge" style="background:${sponsorColor}26;color:${sponsorColor};">Verified</span>`
        : `<span class="badge pending">Pending review</span>`;

      const completions = completionsBySegment[sponsor.matched_segment_id] || [];
      const completionsHtml = completions.map(c => {
        const beforeCaption = `${sponsor.sponsor_display_name} — Before`;
        const afterCaption = `${sponsor.sponsor_display_name} — After`;
        const before = c.before_photo_url
          ? `<figure><a onclick="openLightbox('${c.before_photo_url}','${beforeCaption.replace(/'/g, "\\'")}')"><img src="${c.before_photo_url}" alt="Before"></a><figcaption>Before</figcaption></figure>`
          : '';
        const after = c.after_photo_url
          ? `<figure><a onclick="openLightbox('${c.after_photo_url}','${afterCaption.replace(/'/g, "\\'")}')"><img src="${c.after_photo_url}" alt="After"></a><figcaption>After</figcaption></figure>`
          : '';
        const team = c.team_photo_url
          ? `<div class="team-photo-wrap"><img src="${c.team_photo_url}" alt="${c.completed_by || 'Team'}"><span class="completed-by">${c.completed_by || ''}</span></div>`
          : (c.completed_by ? `<div class="completed-by">${c.completed_by}</div>` : '');
        const date = c.completed_at ? new Date(c.completed_at).toLocaleDateString() : '';
        return `
          <div class="completion-item">
            <h4>${c.service_type || 'Service'} ${date ? '&middot; ' + date : ''}</h4>
            <div class="photo-row">${before}${after}</div>
            ${team}
          </div>
        `;
      }).join('');

      const linksHtml = renderSponsorLinks(sponsor, 'sponsor-links');

      card.innerHTML = `
        ${badgeHtml}
        <h3>${sponsor.sponsor_display_name}</h3>
        <p class="street">${sponsor.street_name}</p>
        ${linksHtml}
        ${completionsHtml}
      `;
      card.style.cursor = 'pointer';
      card.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        locateSponsorOnMap(sponsor);
      });
      list.appendChild(card);
    });
  }

  function locateSponsorOnMap(sponsor) {
    const pos = sponsorPositions[sponsor.id];
    if (!pos || !map) return;
    const latLng = new google.maps.LatLng(pos.lat, pos.lng);
    map.panTo(latLng);
    if (map.getZoom() < 15) map.setZoom(15);
    openSponsorPopup(sponsor, latLng);
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.remove('expanded');
  }

  function colorForSponsor(sponsorId) {
    let hash = 0;
    for (let i = 0; i < sponsorId.length; i++) {
      hash = (hash * 31 + sponsorId.charCodeAt(i)) >>> 0;
    }
    const hue = (hash * 137.508) % 360;
    return `hsl(${hue}, 70%, 58%)`;
  }

  function getLineMidpoint(geojsonGeometry) {
    let coords = geojsonGeometry.type === 'MultiLineString'
      ? geojsonGeometry.coordinates[0]
      : geojsonGeometry.coordinates;

    if (!coords || coords.length === 0) return null;

    const midIdx = Math.floor(coords.length / 2);
    const [lng, lat] = coords[midIdx];
    return { lat, lng };
  }

  let popupOverlay;
  let popupEl;

  function createPopupOverlay(map) {
    class PopupOverlay extends google.maps.OverlayView {
      constructor(el) {
        super();
        this.el = el;
        this.position = null;
        this.setMap(map);
      }
      onAdd() {
        this.getPanes().floatPane.appendChild(this.el);
      }
      onRemove() {
        if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
      }
      draw() {
        if (!this.position) return;
        const proj = this.getProjection();
        if (!proj) return;
        const point = proj.fromLatLngToDivPixel(this.position);
        this.el.style.left = `${point.x}px`;
        this.el.style.top = `${point.y}px`;
      }
      setPosition(latLng) {
        this.position = latLng;
        this.draw();
      }
    }
    return new PopupOverlay(popupEl);
  }

  function popupDetailRow(label, value) {
    if (!value) return '';
    return `<div class="popup-detail-row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
  }

  function openSponsorPopup(sponsor, latLng) {
    const logoHtml = sponsor.photo_url
      ? `<img class="popup-logo" src="${sponsor.photo_url}" alt="">`
      : '';
    const isMatched = sponsor.match_status === 'matched';
    const badgeColor = isMatched ? '#3DDC97' : '#FF6B4A';
    const badgeText = isMatched ? 'Verified sponsor' : 'Pending review';
    const linksHtml = renderSponsorLinks(sponsor, 'popup-links');

    popupEl.innerHTML = `
      <button class="popup-close" aria-label="Close">&times;</button>
      <div class="popup-header">
        ${logoHtml}
        <div>
          <h3>${sponsor.sponsor_display_name}</h3>
          <div class="popup-badge" style="color:${badgeColor};">${badgeText}</div>
        </div>
      </div>
      ${popupDetailRow('Street', sponsor.street_name)}
      ${popupDetailRow('Type', sponsor.sponsor_type ? sponsor.sponsor_type.charAt(0).toUpperCase() + sponsor.sponsor_type.slice(1) : '')}
      ${popupDetailRow('Since', sponsor.started_at ? new Date(sponsor.started_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '')}
      ${linksHtml}
    `;
    popupEl.querySelector('.popup-close').addEventListener('click', closeSponsorPopup);

    popupEl.classList.add('open');
    popupOverlay.setPosition(latLng);
  }

  function closeSponsorPopup() {
    popupEl.classList.remove('open');
  }

  function addSponsorLogoMarker(map, geojsonGeometry, sponsor) {
    const midpoint = getLineMidpoint(geojsonGeometry);
    if (!midpoint) return;
    sponsorPositions[sponsor.id] = midpoint;

    const hasLogo = !!sponsor.photo_url;
    const sponsorColor = colorForSponsor(sponsor.id);

    const markerContent = document.createElement('div');
    markerContent.style.cssText = `
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: ${hasLogo ? '#ffffff' : sponsorColor};
      border: 2px solid ${sponsorColor};
      box-shadow: 0 0 12px ${sponsorColor}80;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    `;

    if (hasLogo) {
      const logoBacking = document.createElement('div');
      logoBacking.style.cssText = `
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      `;
      const img = document.createElement('img');
      img.src = sponsor.photo_url;
      img.alt = sponsor.sponsor_display_name;
      img.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';
      logoBacking.appendChild(img);
      markerContent.appendChild(logoBacking);
    } else {
      markerContent.textContent = (sponsor.sponsor_display_name || '?').charAt(0);
      markerContent.style.color = 'var(--bg)';
      markerContent.style.fontFamily = "'Archivo Black', sans-serif";
      markerContent.style.fontSize = '14px';
    }

    const marker = new google.maps.marker.AdvancedMarkerElement({
      map,
      position: midpoint,
      content: markerContent,
      title: sponsor.sponsor_display_name
    });

    marker.addListener('click', () => {
      openSponsorPopup(sponsor, new google.maps.LatLng(midpoint.lat, midpoint.lng));
    });

    sponsorMarkers.push(marker);
  }

  function drawSegment(map, geojsonGeometry, sponsor) {
    return map.data.addGeoJson({
      type: 'Feature',
      geometry: geojsonGeometry,
      properties: { sponsor_id: sponsor.id }
    })[0];
  }

  /*
    ═══════════════════════════════════════════════════════════════
    COVERAGE ZONE POLYGONS — self-funded cleanup areas
    ═══════════════════════════════════════════════════════════════
    Renders shaded polygon zones (e.g. the SE 22nd–32nd corridor),
    alongside — not replacing — the sponsor pins/street-lines above.
    Reads from a separate Supabase table, map_coverage_zones, so this
    can never affect or be affected by sponsor data.
  */

  const ZONE_DEFAULT_FILL = '#3DDC97';
  const ZONE_DEFAULT_STROKE = '#3DDC97';
  const zonePolygons = [];
  const zoneLogoMarkers = []; // separate from zonePolygons — these are the
                               // clickable logo pins, needed so clustering
                               // (which only works on point markers, not
                               // polygons) has something to actually cluster

  async function fetchCoverageZones() {
    return supabaseGet('map_coverage_zones?select=*');
  }

  function renderCoverageZone(map, zone) {
    if (!zone.polygon_coords || !Array.isArray(zone.polygon_coords) || zone.polygon_coords.length < 3) {
      console.warn('Skipping zone with invalid polygon_coords:', zone.zone_name);
      return;
    }

    const path = zone.polygon_coords.map(pt => ({ lat: pt.lat, lng: pt.lng }));
    const fillColor = zone.fill_color || ZONE_DEFAULT_FILL;

    const polygon = new google.maps.Polygon({
      paths: path,
      strokeColor: ZONE_DEFAULT_STROKE,
      strokeOpacity: 0.9,
      strokeWeight: 2,
      fillColor: fillColor,
      fillOpacity: 0.18,
      map: map,
      clickable: true,
      zIndex: 1
    });

    polygon.addListener('click', (event) => {
      openZonePopup(zone, event.latLng);
    });

    zonePolygons.push(polygon);

    // Logo pin at the zone's center — same visual treatment as a sponsor's
    // street-line logo marker, and following the exact same
    // photo_url + logo_approved pattern already used for sponsor rows
    // (map_sponsorships), so the moderation gate stays consistent across
    // the whole map rather than introducing a second, different rule
    // just for zones.
    const center = zoneCenter(zone);
    const hasLogo = !!zone.photo_url && zone.logo_approved === true;
    const markerColor = fillColor;

    const markerContent = document.createElement('div');
    markerContent.style.cssText = `
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: ${hasLogo ? '#ffffff' : markerColor};
      border: 2px solid ${markerColor};
      box-shadow: 0 0 12px ${markerColor}80;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    `;

    if (hasLogo) {
      const logoBacking = document.createElement('div');
      logoBacking.style.cssText = `
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      `;
      const img = document.createElement('img');
      img.src = zone.photo_url;
      img.alt = zone.sponsor_display_name || zone.zone_name;
      img.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';
      logoBacking.appendChild(img);
      markerContent.appendChild(logoBacking);
    } else {
      markerContent.textContent = (zone.sponsor_display_name || zone.zone_name || '?').charAt(0);
      markerContent.style.color = 'var(--bg)';
      markerContent.style.fontFamily = "'Archivo Black', sans-serif";
      markerContent.style.fontSize = '13px';
    }

    const logoMarker = new google.maps.marker.AdvancedMarkerElement({
      map,
      position: center,
      content: markerContent,
      title: zone.zone_name
    });

    logoMarker.addListener('click', () => {
      openZonePopup(zone, center);
    });

    zoneLogoMarkers.push(logoMarker);
  }

  function zoneCenter(zone) {
    const coords = zone.polygon_coords;
    const lat = coords.reduce((sum, p) => sum + p.lat, 0) / coords.length;
    const lng = coords.reduce((sum, p) => sum + p.lng, 0) / coords.length;
    return new google.maps.LatLng(lat, lng);
  }

  function openZonePopup(zone, latLng) {
    popupEl.innerHTML = `
      <button class="popup-close" aria-label="Close">&times;</button>
      <div class="popup-header">
        <div>
          <h3>${zone.zone_name}</h3>
          <div class="popup-badge" style="color:#3DDC97;">Self-funded coverage</div>
        </div>
      </div>
      ${popupDetailRow('Streets', zone.streets_included)}
      ${popupDetailRow('Sponsor', zone.sponsor_display_name)}
      ${popupDetailRow('Documented', zone.completed_at ? new Date(zone.completed_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '')}
      ${zone.description ? `<p style="font-size:12px;color:var(--panel-ink-soft);margin-top:10px;line-height:1.5;">${zone.description}</p>` : ''}
    `;
    popupEl.querySelector('.popup-close').addEventListener('click', closeSponsorPopup);
    popupEl.classList.add('open');
    popupOverlay.setPosition(latLng);
  }

  async function initCoverageZones(map) {
    let zones = [];
    try {
      zones = await fetchCoverageZones();
    } catch (err) {
      console.error('Could not load coverage zones (non-fatal, sponsor pins unaffected):', err);
      return;
    }
    zones.forEach(zone => renderCoverageZone(map, zone));
  }

  /* ═══════════════════ END COVERAGE ZONE POLYGONS ═══════════════════ */

  async function init() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: PORTLAND_CENTER,
      zoom: 12,
      mapId: MAP_ID,
      disableDefaultUI: true,
      zoomControl: true
    });

    popupEl = document.createElement('div');
    popupEl.id = 'sponsor-popup';
    popupOverlay = createPopupOverlay(map);
    map.addListener('click', closeSponsorPopup);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          map.setCenter({ lat: position.coords.latitude, lng: position.coords.longitude });
          map.setZoom(14);
        },
        (err) => console.log('Geolocation not available, using default center.', err.message)
      );
    }

    let sponsorships = [];
    try {
      sponsorships = await fetchSponsorships();
    } catch (err) {
      showError('Could not load sponsorship data. Please try again shortly.');
      console.error(err);
      return;
    }

    const matchedSponsors = sponsorships.filter(s => s.matched_segment_id);
    const unmatchedSponsors = sponsorships.filter(s => !s.matched_segment_id);
    const segmentIds = matchedSponsors.map(s => s.matched_segment_id);

    let centerlines = [];
    let completions = [];
    try {
      [centerlines, completions] = await Promise.all([
        fetchCenterlines(segmentIds),
        fetchCompletions(segmentIds)
      ]);
    } catch (err) {
      showError('Some map details could not be loaded, showing what is available.');
      console.error(err);
    }

    const centerlineById = {};
    centerlines.forEach(c => { centerlineById[c.id] = c; });

    const completionsBySegment = {};
    completions.forEach(c => {
      if (!completionsBySegment[c.matched_segment_id]) completionsBySegment[c.matched_segment_id] = [];
      completionsBySegment[c.matched_segment_id].push(c);
    });

    map.data.setStyle((feature) => {
      const sponsorId = feature.getProperty('sponsor_id');
      const color = sponsorId ? colorForSponsor(sponsorId) : '#3DDC97';
      return {
        strokeColor: color,
        strokeWeight: 5,
        strokeOpacity: 0.9
      };
    });

    matchedSponsors.forEach(sponsor => {
      const centerline = centerlineById[sponsor.matched_segment_id];
      if (!centerline || !centerline.geojson) return;
      try {
        const geometry = JSON.parse(centerline.geojson);
        drawSegment(map, geometry, sponsor);
        addSponsorLogoMarker(map, geometry, sponsor);
      } catch (err) {
        console.error('Could not parse geometry for segment', sponsor.matched_segment_id, err);
      }
    });

    map.data.addListener('click', (event) => {
      const sponsorId = event.feature.getProperty('sponsor_id');
      const sponsor = sponsorships.find(s => s.id === sponsorId);
      if (!sponsor) return;
      openSponsorPopup(sponsor, event.latLng);
    });

    unmatchedSponsors.forEach(sponsor => {
      if (sponsor.latitude == null || sponsor.longitude == null) return;
      sponsorPositions[sponsor.id] = { lat: sponsor.latitude, lng: sponsor.longitude };
      const marker = new google.maps.Marker({
        position: { lat: sponsor.latitude, lng: sponsor.longitude },
        map,
        title: sponsor.sponsor_display_name,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: '#FF6B4A',
          fillOpacity: 1,
          strokeWeight: 2,
          strokeColor: '#0B1F17'
        }
      });
      marker.addListener('click', () => {
        openSponsorPopup(sponsor, marker.getPosition());
      });
    });

    renderSidebar(sponsorships, completionsBySegment);
    setupBottomSheet();
    await initCoverageZones(map);

    // Clustering — groups nearby markers into a single numbered bubble
    // until zoomed in, per the standard cluster-marker pattern used by
    // map products at scale (e.g. INVOLI's air-traffic map). Sponsors and
    // zone logo-pins are clustered separately so a sponsor pin and a zone
    // pin never merge into one ambiguous bubble together.
    if (window.markerClusterer) {
      if (sponsorMarkers.length > 0) {
        sponsorClusterer = new markerClusterer.MarkerClusterer({ map, markers: sponsorMarkers });
      }
      if (zoneLogoMarkers.length > 0) {
        zoneClusterer = new markerClusterer.MarkerClusterer({ map, markers: zoneLogoMarkers });
      }
    } else {
      console.warn('MarkerClusterer library not loaded — markers will render individually, uncluttered but without grouping at scale.');
    }

    setupLayerToggle();

    const bounds = new google.maps.LatLngBounds();
    let hasBoundableContent = false;

    map.data.forEach((feature) => {
      feature.getGeometry().forEachLatLng((latLng) => {
        bounds.extend(latLng);
        hasBoundableContent = true;
      });
    });

    unmatchedSponsors.forEach(sponsor => {
      if (sponsor.latitude != null && sponsor.longitude != null) {
        bounds.extend({ lat: sponsor.latitude, lng: sponsor.longitude });
        hasBoundableContent = true;
      }
    });

    if (hasBoundableContent) {
      map.fitBounds(bounds);
      google.maps.event.addListenerOnce(map, 'bounds_changed', () => {
        if (map.getZoom() > 16) map.setZoom(16);
      });
    }
  }

  function setupBottomSheet() {
    const sidebar = document.getElementById('sidebar');
    const handle = document.getElementById('sheet-handle');
    if (!sidebar || !handle) return;

    let startY = 0;
    let moved = false;

    function toggle(forceExpand) {
      const expand = forceExpand !== undefined
        ? forceExpand
        : !sidebar.classList.contains('expanded');
      sidebar.classList.toggle('expanded', expand);
    }

    handle.addEventListener('click', () => {
      if (moved) return;
      toggle();
    });

    handle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      moved = false;
    }, { passive: true });

    handle.addEventListener('touchmove', (e) => {
      if (Math.abs(e.touches[0].clientY - startY) > 10) moved = true;
    }, { passive: true });

    handle.addEventListener('touchend', (e) => {
      if (!moved) return;
      const dy = e.changedTouches[0].clientY - startY;
      toggle(dy < 0);
      setTimeout(() => { moved = false; }, 50);
    });
  }

  // Layer toggle — connects the two checkboxes to actually show/hide each
  // group. Individual markers get their .map property toggled directly;
  // clusterers (if active) get cleared/re-added since MarkerClusterer
  // manages its own internal marker map separately from the markers'
  // own .map property.
  function setupLayerToggle() {
    const sponsorsCheckbox = document.getElementById('toggle-sponsors');
    const zonesCheckbox = document.getElementById('toggle-zones');
    if (!sponsorsCheckbox || !zonesCheckbox) return;

    function setSponsorsVisible(visible) {
      if (sponsorClusterer) {
        sponsorClusterer.clearMarkers();
        if (visible) sponsorClusterer.addMarkers(sponsorMarkers);
      } else {
        sponsorMarkers.forEach(m => { m.map = visible ? map : null; });
      }
      // Unmatched sponsors (plain google.maps.Marker circles) and the
      // sponsor street-lines (map.data layer) aren't part of the
      // clusterer/marker array above, so toggle them directly too.
      map.data.forEach(feature => {
        map.data.overrideStyle(feature, { visible });
      });
    }

    function setZonesVisible(visible) {
      if (zoneClusterer) {
        zoneClusterer.clearMarkers();
        if (visible) zoneClusterer.addMarkers(zoneLogoMarkers);
      } else {
        zoneLogoMarkers.forEach(m => { m.map = visible ? map : null; });
      }
      zonePolygons.forEach(p => p.setMap(visible ? map : null));
    }

    sponsorsCheckbox.addEventListener('change', (e) => setSponsorsVisible(e.target.checked));
    zonesCheckbox.addEventListener('change', (e) => setZonesVisible(e.target.checked));
  }

  window.initMap = init;
</script>

<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDvhU7V4buTn7Sc0fRlr_V5FA2nftN7HK8&callback=initMap&loading=async&libraries=marker"></script>

</body>
